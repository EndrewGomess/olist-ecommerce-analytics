version: 2

models:
  - name: stg_orders
    description: "Tabela de staging dos pedidos Olist com tipagem e padronização de nomenclatura."
    columns:
      - name: order_id
        description: "Chave primária do pedido."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Identificador do cliente."
        tests:
          - not_null
      - name: order_status
        description: "Status do pedido no marketplace."
        tests:
          - not_null
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - invoiced
                - processing
                - unavailable
                - created
                - approved

  - name: stg_order_items
    description: "Tabela de staging dos itens comprados com validação de preços e fretes."
    columns:
      - name: order_id
        description: "Identificador do pedido pai."
        tests:
          - not_null
      - name: order_item_id
        description: "Sequencial do item no pedido."
        tests:
          - not_null
      - name: price
        description: "Valor do produto."
        tests:
          - not_null
